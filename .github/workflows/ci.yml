name: ci

# Hosted GitHub Actions CI is intentionally disabled to avoid consuming the
# account's included Actions minutes. Keep this workflow tracked because the
# local CI gate audits that GitHub CI delegates to the same repo-root script.
# Re-enable by restoring push/pull_request triggers and removing the job guard.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0-regression:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Perl toolchain
        run: |
          perl -V:version
          prove --version

      - name: Run shared local CI gate
        run: bash tools/run_ci_local.sh
