[workspace]
resolver = "2"
members = ["linkedspec-core", "linkedspec-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Artistic-2.0"
repository = "https://github.com/rdje/linkedspec"
authors = ["Richard DJE"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
